
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 글 모음</title>
<style>
    body {
        margin: 0;
        font-family: 'Noto Sans KR', sans-serif;
        background: #f4f4f4;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        width: 30%;
        background: linear-gradient(180deg, #2c3e50, #34495e);
        color: white;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
    }

    .sidebar h2 {
        margin-top: 0;
        text-align: center;
        letter-spacing: 2px;
    }

    .title-item {
        padding: 12px;
        margin: 8px 0;
        background: rgba(255,255,255,0.1);
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    .title-item:hover {
        background: rgba(255,255,255,0.3);
    }

    .content {
        width: 70%;
        padding: 40px;
        box-sizing: border-box;
        background: #ffffff;
        overflow-y: auto;
    }

    .content-box {
        background: #fdf6e3;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        line-height: 1.8;
        font-size: 18px;
        white-space: pre-line;
    }

    audio {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
    }
</style>
</head>
<body>

<div class="sidebar">
    <h2>글 목록</h2>
    <div class="title-item" onclick="showContent(0)">마니산의 겨울</div>
    <div class="title-item" onclick="showContent(1)">봄이 오는 아침</div>
    <div class="title-item" onclick="showContent(2)">봄이 오면</div>
</div>

<div class="content">
    <div class="content-box" id="contentBox">
        왼쪽에서 제목을 선택하세요.
    </div>
</div>

<!-- 배경 음악 -->
<audio id="bgMusic" controls loop style="position:fixed; bottom:20px; right:20px; width:260px; z-index:1000; background:white; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
    <source src="music.mp3" type="audio/mpeg">
    브라우저가 오디오를 지원하지 않습니다.
</audio>

<script>
// 브라우저 자동재생 제한 대응
const bgMusic = document.getElementById('bgMusic');

// 첫 클릭 시 음악 재생
function enableMusic() {
    bgMusic.play().catch(()=>{});
    document.removeEventListener('click', enableMusic);
}

document.addEventListener('click', enableMusic);
</script>

<script>
    const contents = [
        `벌거벗은 채 겨울을 살아가는
마니산 소사나무에
오늘은 해가 오래 머문다
물 빠진 바닷가에
길게 누워 있는
장봉도의 그림자
봄이 물길로 흘러오면
갯벌은 다시 살아나고
살찐 숭어는 하늘로 뛰어오르는
그 섬의 그림자
겨울을 살아가는 방법을
모두가 알고 있다
나만 모른 채
봄은
기다린다고
오지 않는다는 것을
모두 알고 있다 .\n\n시라면 줄바꿈이 자연스럽게 유지됩니다.`,
        `스킨답서스가 길게 기대 선 창가
로즈허브는 향으로 단장하고
호접란은 봄의 여왕처럼
치맛폭 넓은 잎을 펼친다
저만치 꽃베고니아 형광빛
아침을 먼저 깨우고
외로운 듯 늘어진 알로카시아여
오늘은 친구를 맞이하자
호야야, 널 잊은 적 없다
지난 추위 속에서도
살아남은 너와 나
반려 아닌가
늘 푸른 빛이여
오월을 기다리는 백화등 줄기
볼품없는 꽃잎으로도
천지에 짙은 향을 뿌리고
봄빛이 창문으로 밀려들면
집 안은 들뜬 소리로 가득하다
학예회를 앞둔
어린 딸처럼 .\n\n당신의 노년의 사유를 담아도 좋습니다.`,
        `봄이 오면
겨우내 얼어 굳었던 흙을
호미로 살살 일구어 꽃을 심으렵니다.
팬지를 심고, 튤립도 심고,
아네모네 한 송이도 눕혀 보렵니다.
그래도 허전한 마음이 남는다면
제비꽃을 심을까요,
은방울꽃을 심을까요,
서러운 노래를 불어 주는
천사의 나팔을 심어볼까요.
반 평도 안 되는 작은 땅을
봄날 내내 뒤집어도
이처럼 텅 빈 가슴을
손이 부르트도록 호미질해도
당신이 피어나는 꽃은
끝내 심을 수가 없습니다. .\n\n계속 추가 가능합니다.`
    ];

    function showContent(index) {
        document.getElementById('contentBox').innerText = contents[index];
    }
</script>

</body>
</html>
